spring.application.name=Blog System

# === DATABASE CONFIG ===
# Đọc trực tiếp biến SPRING_DATASOURCE_URL (tránh xung đột với biến DATABASE_URL mặc định của Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:blog_system;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

jwt.secret=${JWT_SECRET:blogsystem_super_secret_key_2024_cannot_guess}
jwt.expiration=86400000

server.port=${PORT:8080}