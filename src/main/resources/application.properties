spring.application.name=Blog System

# === DATABASE CONFIG ===
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.data.web.pageable.max-page-size=100

# HikariCP Pool settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

jwt.secret=${JWT_SECRET:change-me-in-production-use-a-long-random-secret}
jwt.expiration=86400000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://anhhoangg.id.vn,http://localhost:3000,http://localhost:5173}
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}

server.port=${PORT:8080}

# === SECURITY & PRODUCTION HARDENING ===
# Tắt Swagger UI & OpenAPI docs mặc định trên môi trường Production
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Tắt Spring Boot Actuator endpoints trên môi trường Production
management.endpoints.web.exposure.exclude=*
management.endpoints.enabled-by-default=false

# Tắt StackTrace, Exception class và internal detail trong Error Response mặc định
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# === GEMINI AI CONFIG ===
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

