spring.application.name=Blog System

# === DATABASE CONFIG ===
# Mặc định sử dụng H2 In-Memory làm Fallback an toàn (Server luôn khởi chạy 100% thành công)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:blog_system;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Không sập Server nếu chờ kết nối DB xa (HikariCP Retry)
spring.datasource.hikari.initialization-fail-timeout=-1

jwt.secret=${JWT_SECRET:blogsystem_super_secret_key_2024_cannot_guess}
jwt.expiration=86400000

server.port=${PORT:8080}