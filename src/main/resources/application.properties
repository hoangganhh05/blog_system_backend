spring.application.name=Blog System

# === DATABASE CONFIG ===
# Hỗ trợ cả 2 chuẩn tên biến môi trường (SPRING_DATASOURCE_URL & DATABASE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/blog_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:hoang2005}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:blogsystem_super_secret_key_2024_cannot_guess}
jwt.expiration=86400000

server.port=${PORT:8080}