spring.application.name=Blog System

# === DATABASE CONFIG ===
# Render PostgreSQL (dùng biến môi trường khi deploy)
# Localhost MySQL (dùng mặc định khi chạy trên máy cá nhân)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/blog_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:hoang2005}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}

jwt.secret=${JWT_SECRET:blogsystem_super_secret_key_2024_cannot_guess}
jwt.expiration=86400000

server.port=${PORT:8080}